name: Build Windows EXE

# Draait automatisch bij een push naar main, bij een tag (v1.0.0 etc.),
# of handmatig via de "Run workflow" knop in de Actions-tab op GitHub.
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Repository uitchecken
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: EXE bouwen met PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "FontTextExporter" `
            app.py

      - name: Build controleren
        run: dir dist

      - name: EXE uploaden als build-artifact
        uses: actions/upload-artifact@v4
        with:
          name: FontTextExporter-windows
          path: dist/FontTextExporter.exe
          if-no-files-found: error

      # Bij een versietag (bv. v1.0.0) wordt automatisch ook een GitHub
      # Release aangemaakt met de exe erin, klaar om te downloaden.
      - name: GitHub Release aanmaken
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FontTextExporter.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
